name: build-and-test
on: [push, pull_request]
jobs:
  verify:
    env:
      CITRUS_HISTORICAL_DATA: ${{ github.workspace }}/artifacts/cache
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - if: runner.os != 'Windows'
        run: dotnet restore src/Citrus.Cli/Citrus.Cli.csproj --configfile NuGet.Config
      - if: runner.os != 'Windows'
        run: dotnet restore tests/Citrus.Tests/Citrus.Tests.csproj --configfile NuGet.Config
      - if: runner.os != 'Windows'
        run: dotnet build src/Citrus.Cli/Citrus.Cli.csproj --no-restore -c Release
      - if: runner.os != 'Windows'
        run: dotnet build tests/Citrus.Tests/Citrus.Tests.csproj --no-restore -c Release
      - if: runner.os == 'Windows'
        run: dotnet restore Citrus.slnx --configfile NuGet.Config
      - if: runner.os == 'Windows'
        run: dotnet build Citrus.slnx --no-restore -c Release
      - run: dotnet run --project tests/Citrus.Tests -c Release --no-build --no-restore
      - run: dotnet run --project src/Citrus.Cli -c Release --no-build --no-restore -- data generate tests/Citrus.Tests/Fixtures/DemoGeneration.json artifacts/cache/demo-data.json
      - run: dotnet run --project src/Citrus.Cli -c Release --no-build --no-restore -- validate Backtests/Demo.json
      - run: dotnet run --project src/Citrus.Cli -c Release --no-build --no-restore -- backtest . Demo
      - run: dotnet run --project src/Citrus.Cli -c Release --no-build --no-restore -- replay Results/Demo
      - if: runner.os == 'Windows'
        run: dotnet run --project src/Citrus.Desktop -c Release --no-build --no-restore -- --smoke-test artifacts/desktop-smoke
